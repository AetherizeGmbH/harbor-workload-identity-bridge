name: e2e

on:
  pull_request:
    branches: [main]
    paths:
      - "bridge/**"
      - "plugin/**"
      - "installer/**"
      - "go.mod"
      - "go.sum"
      - "charts/harbor-bridge/**"
      - "test/e2e/**"
      - "Dockerfile.*"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tofu-e2e:
    name: tofu test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        # 1.12+ allows function calls (base64encode, etc.) inside string
        # interpolations within run-block `variables` heredocs. 1.8.5
        # rejected them with "Function calls not allowed". Pinned to
        # match what brew installs locally.
        with: { tofu_version: 1.12.0 }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with: { version: v4.3.0 }
      # No separate docker build step: the tofu test harness's
      # `build_images` run block (modules/docker-build) shells out to
      # `docker build` for bridge + plugin before the kind cluster
      # tries to load them.
      - name: Install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true   # we want the binary; cluster is created by tofu
          # The harness creates the cluster with this binary, so it must
          # support the node image in modules/kind-cluster (kind v0.33+
          # for kindest/node v1.37: kubeadm 1.37 dropped the v1beta3 config
          # older kind writes). Renovate bumps it together with the node
          # image (group "kind").
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          version: v0.33.0
      - name: Run tofu test
        working-directory: test/e2e
        # No `| tee`: with the runner's default `bash -e` (no pipefail)
        # a tee'd `tofu test` once returned tee's exit code and a real
        # failure looked green. The step log already holds the output.
        shell: bash
        run: |
          set -Eeuo pipefail
          tofu init
          TF_VAR_pause_after_pull=false tofu test -verbose
      # A failing Job stage writes pod/event/bridge/installer/kubelet
      # diagnostics to test/e2e/.diag/<job>/ before tofu destroys the
      # cluster. Never Secret contents — only their names.
      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-diagnostics
          path: test/e2e/.diag/
          if-no-files-found: ignore
          retention-days: 7
