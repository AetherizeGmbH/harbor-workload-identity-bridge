name: harbor-compat

# Harbor compatibility matrix (ADR-0020). Runs the full kubelet-driven e2e
# pull chain against several Harbor chart versions and writes the result into
# the README compatibility table via an auto-opened PR. Weekly + on demand —
# NOT per-PR: each leg stands up a real Harbor (~5 min) and up to six of those
# on every change is wasteful. PR coverage stays single-version in e2e.yml.
on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      charts:
        description: >-
          JSON array of Harbor *chart* versions to probe instead of the default
          matrix, e.g. ["1.11.4","1.12.6"] to probe below the floor. A probe run
          reports its results in the run summary only: it never touches the
          README table or its PR. To move the published range, edit the default
          list (ADR-0020). Leave empty for the regular run.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: harbor-compat
  cancel-in-progress: false

jobs:
  setup:
    name: pick matrix
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.pick.outputs.charts }}
    steps:
      # Only the harbor module: it holds the chart PR e2e installs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: test/e2e/modules/harbor/main.tf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with: { version: v4.3.1 }
      - id: pick
        env:
          INPUT_CHARTS: ${{ inputs.charts }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_CHARTS" ]; then
            # Each entry becomes a job name and a shell argument.
            echo "$INPUT_CHARTS" | jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' >/dev/null \
              || { echo "::error::charts must be a JSON array of x.y.z chart versions"; exit 1; }
            echo "charts=$INPUT_CHARTS" >> "$GITHUB_OUTPUT"
          else
            # Every second Harbor minor from the floor candidate up, each at
            # its last patch when added (chart 1.N -> Harbor 2.(N-4)):
            # 1.13.5=2.9.5  1.15.2=2.11.2  1.17.5=2.13.5  1.19.4=2.15.4
            # Two more entries move by themselves:
            # - pinned: the chart PR e2e installs, the harbor module's default,
            #   which Renovate bumps. A hand-kept copy here lagged behind it,
            #   so the table claimed a lower ceiling than every PR tests.
            # - newest: the newest stable chart in the Harbor Helm repository.
            #   Renovate proposes a chart only 7 days after its release, and
            #   the bump still needs a merge. This entry tests a new Harbor
            #   release on the next weekly run (ADR-0020 §4). It skips that
            #   wait on purpose: the matrix job holds no secrets and only
            #   reads this repository.
            module=test/e2e/modules/harbor/main.tf
            pinned=$(sed -n 's/^[[:space:]]*default_version_harbor[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$module")
            [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::cannot read default_version_harbor from $module (got '$pinned')"; exit 1; }
            helm repo add harbor https://helm.goharbor.io >/dev/null
            helm repo update harbor >/dev/null
            # Without --versions, helm search returns only the newest
            # version; without --devel, it skips pre-releases.
            newest=$(helm search repo harbor/harbor --output json \
              | jq -r '[.[] | select(.name == "harbor/harbor")][0].version // empty')
            [[ "$newest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::cannot read the newest harbor chart from https://helm.goharbor.io (got '$newest')"; exit 1; }
            charts=$(jq -cn --arg pinned "$pinned" --arg newest "$newest" \
              '["1.13.5","1.15.2","1.17.5","1.19.4",$pinned,$newest] | unique_by(split(".") | map(tonumber))')
            echo "pinned=$pinned newest=$newest"
            echo "charts=$charts" | tee -a "$GITHUB_OUTPUT"
          fi

  matrix:
    name: e2e ${{ matrix.chart }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.setup.outputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job runs third-party charts and images, the newest one
          # without Renovate's wait. Nothing here pushes.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with: { tofu_version: v1.13.9 }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with: { version: v4.3.1 }
      - name: Install kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
          # Must support the node image; see e2e.yml.
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          version: v0.33.0
      - name: Resolve Harbor version
        id: app
        env:
          CHART: ${{ matrix.chart }}
        run: |
          set -Eeuo pipefail
          helm repo add harbor https://helm.goharbor.io >/dev/null
          helm repo update harbor >/dev/null
          app="$(helm show chart harbor/harbor --version "$CHART" \
            | awk -F': *' '/^appVersion:/{print $2}' | tr -d '"\r')"
          [[ "$app" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::chart $CHART names no x.y.z appVersion (got '$app')"; exit 1; }
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"
      # A red e2e fails this step and so the job. The steps that record the
      # result and upload the diagnostics run after it on their own `if`.
      # The earlier version wrote the record in this step, after `tofu
      # test`. The runner starts every `run` script with `bash -e`, so a red
      # run ended the script first: the leg lost its table row, and the
      # diagnostics upload (implicit `success() &&`) was skipped too.
      - name: Run e2e
        id: e2e
        working-directory: test/e2e
        shell: bash
        env:
          CHART: ${{ matrix.chart }}
        # No `| tee`: see e2e.yml. The step log holds the output.
        run: |
          set -Eeuo pipefail
          tofu init
          TF_VAR_version_harbor="$CHART" TF_VAR_pause_after_pull=false tofu test -verbose
      # Also after a skipped e2e (the version did not resolve): the table
      # must show a failed leg as a failure, not drop its row.
      - name: Record result
        if: always()
        env:
          CHART: ${{ matrix.chart }}
          APP: ${{ steps.app.outputs.app }}
          OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          set -Eeuo pipefail
          if [ "$OUTCOME" = success ]; then status=pass; else status=fail; fi
          mkdir -p compat-result
          jq -cn --arg chart "$CHART" --arg app "${APP:-unknown}" \
            --arg status "$status" --arg date "$(date -u +%F)" \
            '{chart: $chart, app: $app, status: $status, date: $date}' \
            | tee compat-result/result.json
      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compat-diagnostics-${{ matrix.chart }}
          path: test/e2e/.diag/
          # Every file there is "hidden" to upload-artifact (it sits in a
          # directory whose name starts with a dot), and hidden files are
          # left out unless this is set. The harness writes only
          # diagnostics there, never Secret contents.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compat-result-${{ matrix.chart }}
          path: compat-result/result.json
          if-no-files-found: error

  # A probe run (custom chart list) must not reach the README: the table
  # would hold only the probe rows, with floor and ceiling computed from
  # them, and the PR would overwrite a pending weekly refresh on the shared
  # branch. On schedule `inputs.charts` is null, which compares equal to ''.
  aggregate:
    name: update README table
    needs: matrix
    if: always() && inputs.charts == ''
    runs-on: ubuntu-latest
    # The PR is opened with the App token; GITHUB_TOKEN only reads.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: compat-artifacts
          pattern: compat-result-*
      - name: Render compatibility table
        run: |
          set -euo pipefail
          python3 hack/render-compat-table.py \
            'compat-artifacts/compat-result-*/result.json' README.md
      # A PR opened with GITHUB_TOKEN does not trigger workflows, so the
      # table PR would carry zero checks and become unmergeable once
      # required checks are enforced. Open it as the Renovate App instead
      # (same App and secrets as release.yml).
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - name: Open PR with refreshed table
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # main requires signed commits: with an App token the action
          # creates the commit through the GitHub API, which signs it as
          # the App. Without this the table PR can never be merged.
          sign-commits: true
          commit-message: "docs: refresh Harbor compatibility matrix from e2e runs"
          title: "docs: refresh Harbor compatibility matrix"
          body: >-
            Auto-generated by the `harbor-compat` workflow from the latest matrix
            e2e runs (ADR-0020). Floor = lowest passing Harbor, ceiling = highest.
          branch: harbor-compat-table
          delete-branch: true
          labels: dependencies
          add-paths: README.md

  probe-report:
    name: report probe results
    needs: matrix
    if: always() && inputs.charts != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: compat-artifacts
          pattern: compat-result-*
      - name: Render probe results into the run summary
        run: |
          set -euo pipefail
          {
            echo "## Harbor compat probe (README table unchanged)"
            echo
            python3 hack/render-compat-table.py --summary \
              'compat-artifacts/compat-result-*/result.json'
          } >> "$GITHUB_STEP_SUMMARY"
