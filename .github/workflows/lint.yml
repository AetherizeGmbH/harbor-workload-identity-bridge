name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # golangci-lint refuses to load code whose go.mod targets a newer
          # Go than the one it was BUILT with ("the Go language version
          # (go1.26) used to build golangci-lint is lower than the targeted
          # Go version"). The targeted version includes the `toolchain`
          # directive, so a toolchain bump (Renovate gomod PRs) needs a
          # linter built with at least that Go. v2.13.x is built with
          # go1.27.0. Renovate's github-actions manager bumps this.
          version: v2.13.2
          args: --timeout=5m

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            gofmt -d -s .
            exit 1
          fi

  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with: { version: v4.3.0 }
      # The Makefile owns the list of values files (CHART_CASES); a
      # hand-written list here already drifted once.
      - run: make chart-lint

  terraform-fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        # Match e2e.yml's pin: same major fmt rules, no laptop/CI drift.
        with: { tofu_version: v1.12.6 }
      - run: tofu fmt -check -recursive test/e2e test/e2e-gke || (echo "run 'tofu fmt -recursive test/e2e test/e2e-gke' locally" && exit 1)

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          pip install --user yamllint
          # No --strict: warnings (e.g. one shell command that runs
          # over our 200-char soft limit in e2e.yml) shouldn't fail
          # CI. key-duplicates remains an `error` rule and so still fails.
          ~/.local/bin/yamllint -c .yamllint.yml .github/workflows charts/harbor-bridge

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile.bridge, Dockerfile.plugin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Static-checks the workflows themselves: shellcheck on run: blocks,
      # ${{ }} expression typing, and invalid action inputs. Runs as the
      # upstream Docker image (digest-pinned; Renovate keeps tag+digest fresh).
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
