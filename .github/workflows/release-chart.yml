name: release-chart

# Publishes the Helm chart as an OCI artifact to ghcr.io. We do NOT use
# helm/chart-releaser-action + gh-pages: the org enforces GitHub's
# "Immutable Releases" policy, which fails chart-releaser's
# create-release-then-upload-asset flow with HTTP 422 "Cannot upload
# assets to an immutable release". OCI sidesteps GitHub Releases
# entirely and puts the chart next to the images in ghcr.io.
#
# Users install via:
#   helm install harbor-bridge \
#     oci://ghcr.io/aetherizegmbh/charts/harbor-workload-identity-bridge \
#     --version X.Y.Z -f values.yaml

on:
  workflow_dispatch:
    inputs:
      version:
        description: Chart + appVersion (from semantic-release). Without leading v.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Per-version so backfills don't queue against each other.
  group: release-chart-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  push:
    name: helm OCI push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # OCI push to ghcr.io
      id-token: write      # keyless cosign signing
      attestations: write  # GitHub artifact attestation
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version '$VERSION' is not x.y.z"; exit 1; }
      # Package exactly the tagged release commit. semantic-release set
      # version and appVersion in Chart.yaml before it tagged, so the chart
      # is used as committed and only checked here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with: { version: v4.3.0 }
      - name: Check chart version + appVersion
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -qx "version: ${VERSION}" charts/harbor-bridge/Chart.yaml \
            || ! grep -qx "appVersion: \"${VERSION}\"" charts/harbor-bridge/Chart.yaml; then
            echo "::error::Chart.yaml at v${VERSION} does not carry version/appVersion ${VERSION}"
            head charts/harbor-bridge/Chart.yaml
            exit 1
          fi
      - name: Package chart
        run: helm package charts/harbor-bridge --destination /tmp
      - name: Login to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        # Lowercased owner: ghcr.io is case-insensitive at the registry
        # layer but the OCI spec mandates lowercase for namespaces.
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_ENV"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io \
            --username "$ACTOR" --password-stdin
      - name: Push to OCI
        id: push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          helm push "/tmp/harbor-workload-identity-bridge-${VERSION}.tgz" \
            "oci://ghcr.io/${OWNER_LC}/charts" 2>&1 | tee /tmp/push.log
          digest=$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' /tmp/push.log)
          [ -n "$digest" ] || { echo "::error::no digest in helm push output"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${OWNER_LC}/charts/harbor-workload-identity-bridge" >> "$GITHUB_OUTPUT"
      # The chart is signed like the images, bound to its OCI digest.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign chart (keyless)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "$GITHUB_TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin
          cosign sign --yes "${REF}@${DIGEST}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
