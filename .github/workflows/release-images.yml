name: release-images

on:
  # Sole trigger: explicit dispatch from release.yml after semantic-release
  # succeeds, plus the same input for ad-hoc rebuilds. The `tag` input is the
  # semver string without leading `v`. We deliberately do NOT add
  # `on: push: tags`: semantic-release now pushes the tag as the release
  # GitHub App, which WOULD satisfy push-tags (App pushes aren't recursion-
  # suppressed like GITHUB_TOKEN) — but it would race a duplicate build
  # against the dispatch. One dispatch path keeps every build gated on a real
  # release, deterministic, and idempotent.
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push (without leading v). For ad-hoc rebuilds.
        required: true
        type: string

# Read-only default. Every job below grants itself exactly the rights it
# needs (build, latest, attest) or none (sbom); a job added without its own
# block must not inherit the signing identity or push rights.
permissions:
  contents: read

concurrency:
  # Group by tag so independent versions don't queue against each other.
  # If we grouped by github.ref, dispatching three orphan-rebuilds in
  # parallel would let GitHub drop all-but-newest queued runs.
  group: release-images-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: build + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign signing
    strategy:
      fail-fast: false
      # Matrix carries (component, image) per row. The bridge image is
      # the project's primary artifact and gets the bare project name;
      # the plugin gets the `-plugin` suffix.
      matrix:
        include:
          - component: bridge
            image: harbor-workload-identity-bridge
          - component: plugin
            image: harbor-workload-identity-bridge-plugin
    steps:
      - name: Resolve tag + lowercase owner
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not x.y.z"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # OCI namespaces must be lowercase per spec; org name "AetherizeGmbH"
          # would 404 on `docker pull` for case-sensitive clients.
          echo "owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # Build exactly the tagged release commit, not whatever main points
      # at by the time this dispatched run starts. An ad-hoc rebuild of an
      # existing version rebuilds the same source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ steps.tag.outputs.owner_lc }}/${{ matrix.image }}
          # Only the version tag. `latest` is moved by the `latest` job
          # below, which never points it at an older release.
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build cache for releases: a poisoned cache entry would
          # otherwise flow straight into a signed image.
          no-cache: true
          provenance: true
          sbom: false

      # Keyless signing via Sigstore (Fulcio short-lived certificates, Rekor
      # transparency log) with the workflow's GitHub OIDC token; no long-lived
      # keys. Everything binds to the immutable digest, never to a tag.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        env:
          IMAGE: ghcr.io/${{ steps.tag.outputs.owner_lc }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Record digest
        env:
          IMAGE: ghcr.io/${{ steps.tag.outputs.owner_lc }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p out
          printf '%s\n' "$IMAGE" > out/image
          printf '%s\n' "$DIGEST" > out/digest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-${{ matrix.component }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  # `latest` names the highest released version, not the most recent build.
  # Pushing it from the build job moved it backwards whenever an older
  # version was rebuilt ad hoc, or when two releases cut minutes apart
  # finished their builds out of order. This job reads the highest vX.Y.Z
  # tag when it runs and points `latest` at the digest that version already
  # has in the registry: a retag, no rebuild, so the signature and the
  # attestations (bound to the digest) cover `latest` too. If the highest
  # version is still building, the job leaves `latest` alone; that
  # version's own run moves it. One concurrency group across all tags
  # serialises the retags. GitHub keeps only one pending job per group, so
  # a burst of runs can cancel a pending `latest` job; that is harmless,
  # because the job that replaces it does the same work.
  latest:
    name: point latest at the highest release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read   # list the release tags
      packages: write  # retag in ghcr.io
    concurrency:
      group: release-images-latest
      cancel-in-progress: false
    steps:
      - name: Find the highest release
        id: max
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Strict x.y.z only: a stray non-semver tag must not sort highest.
          version=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' \
            | grep -E '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's#^refs/tags/v##' | sort -V | tail -n 1)
          [ -n "$version" ] || { echo "::error::no vX.Y.Z release tag found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag latest
        env:
          OWNER: ${{ steps.max.outputs.owner_lc }}
          VERSION: ${{ steps.max.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er .digest
          }
          for image in harbor-workload-identity-bridge harbor-workload-identity-bridge-plugin; do
            ref="ghcr.io/${OWNER}/${image}"
            if ! digest=$(digest_of "${ref}:${VERSION}"); then
              # This run just pushed ${TAG}; if that is the highest release,
              # its image must be there.
              if [ "$VERSION" = "$TAG" ]; then
                echo "::error::cannot resolve ${ref}:${VERSION}, which this run pushed"
                exit 1
              fi
              echo "::notice::${ref}:${VERSION} is not pushed yet; its own run moves latest"
              continue
            fi
            if [ "$(digest_of "${ref}:latest" 2>/dev/null || true)" = "$digest" ]; then
              echo "${ref}:latest already points at ${VERSION} (${digest})"
              continue
            fi
            docker buildx imagetools create --tag "${ref}:latest" "${ref}@${digest}"
            echo "${ref}:latest -> ${VERSION} (${digest})"
          done

  # Trivy runs in a job of its own with no token: the images are public,
  # and a compromised scanner binary must not hold the signing identity
  # or push rights of the build job.
  sbom:
    name: SBOM (Trivy)
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        component: [bridge, plugin]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-${{ matrix.component }}
          path: out
      - id: ref
        run: echo "ref=$(cat out/image)@$(cat out/digest)" >> "$GITHUB_OUTPUT"
      # CycloneDX is the predicate format cosign attests against. For a
      # multi-arch index Trivy resolves a single platform (linux/amd64).
      # Same digest-pinned image as trivy.yml; Renovate bumps both.
      - name: Generate SBOM with Trivy
        uses: docker://aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        with:
          args: image --format cyclonedx --output out/sbom.cdx.json ${{ steps.ref.outputs.ref }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.component }}
          path: out/sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

  attest:
    name: attest SBOM + provenance
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      packages: write      # push the attestations next to the image
      id-token: write      # keyless signing
      attestations: write  # GitHub artifact attestations
    strategy:
      fail-fast: false
      matrix:
        component: [bridge, plugin]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-${{ matrix.component }}
          path: out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-${{ matrix.component }}
          path: out
      - id: ref
        run: |
          echo "image=$(cat out/image)" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat out/digest)" >> "$GITHUB_OUTPUT"
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Attest SBOM (keyless)
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.ref.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate out/sbom.cdx.json "${IMAGE}@${DIGEST}"
      # Signed SLSA build provenance, verifiable with
      # `gh attestation verify oci://<image>@<digest> --owner AetherizeGmbH`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.ref.outputs.digest }}
          push-to-registry: true
