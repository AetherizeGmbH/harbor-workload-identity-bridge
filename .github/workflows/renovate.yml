name: renovate

on:
  schedule:
    # Twice a day so automerge has a chance to rebase open PRs against
    # the latest main shortly after a merge. UTC is the only timezone
    # GitHub Actions cron understands; 07:00/16:00 UTC is 09:00/18:00
    # Berlin in CEST (summer) and 08:00/17:00 Berlin in CET (winter).
    - cron: "0 7,16 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
        type: choice
        options: [trace, debug, info, warn, error]
      dryRun:
        description: Dry run (no PRs created)
        default: "false"
        type: string

# Renovate uses a GitHub App installation token (minted below), not
# GITHUB_TOKEN, so the workflow's own scope only needs what
# actions/checkout requires. All branch creation, PR opening, issue
# management, and check-run reading happens via the App identity, which
# is also what makes PR-triggered workflows (lint, test, e2e) actually
# fire on Renovate PRs: events from a non-GITHUB_TOKEN identity are
# not subject to GitHub's recursion-prevention suppression.
#
# Automerge: Renovate merges a PR itself on a later run, once every
# check on it is green (platformAutomerge is off in renovate.json).
#
# This workflow fails instead of staying green when Renovate cannot do
# its job. From 2026-09-24 to 2026-11 every run stopped at the first
# branch status it had to set (the App lacked "Commit statuses: write",
# which minimumReleaseAge needs), logged that only at DEBUG, and exited
# 0: no PR was opened or merged for six weeks while the runs were green.
permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false  # never cancel a renovate run

jobs:
  renovate:
    name: self-hosted renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The token asks for exactly the permissions Renovate uses here
      # (docs.renovatebot.com/modules/platform/github, "Running as a
      # GitHub App"). GitHub refuses the token (422) when the App
      # installation lacks one of them, so a missing permission fails
      # this step instead of failing silently inside Renovate.
      #   statuses: write          renovate/stability-days (minimumReleaseAge)
      #   vulnerability-alerts     Dependabot alerts (vulnerabilityAlerts)
      #   workflows: write         updates to .github/workflows/*
      #   checks: read             branch status before automerge
      - name: Mint Renovate App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
          permission-checks: read
          permission-workflows: write
          permission-vulnerability-alerts: read
      - uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Exit non-zero (3-8) when the repository run ends in an error
          # state, e.g. 6 for repository-changed; without it Renovate
          # exits 0 and the action reports success. Experimental since
          # Renovate 44.77.0. Logged ERRORs already exit 1.
          RENOVATE_EXIT_CODE_FOR_ERRORS: "true"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == 'true' && 'full' || '' }}
          # The action defaults to onboarding-style PRs; this repo opts in:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
