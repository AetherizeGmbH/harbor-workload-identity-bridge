name: trivy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Trivy code scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to publish the SARIF report to the repo's Security tab
      # (code scanning). Free for this public repo; no GHAS needed.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Filesystem (repo) scan: dependency vulns (go.mod/go.sum),
      # misconfigurations (Dockerfiles, Helm charts, OpenTofu) and
      # leaked secrets. Trivy runs as its upstream image, pinned by digest
      # (the same index is published on Docker Hub, ghcr.io and ECR Public,
      # and cosign-signed by aquasecurity/trivy's release workflow).
      # Renovate's github-actions manager bumps tag and digest together;
      # Docker Hub is used because the aquasecurity org's IP allow list
      # blocks Renovate's GitHub lookups.
      #   --severity with --format sarif: the SARIF holds exactly the
      #     findings the gate fails on (HIGH/CRITICAL), so the Security tab
      #     and the job result agree.
      #   --ignore-unfixed: vulns without an upstream fix cannot be acted
      #     on and must not block PRs.
      #   --ignorefile: accepted misconfigurations (e.g. the privileged
      #     node-installer DaemonSet), each path-scoped and justified. Trivy
      #     does not auto-load the .yaml form.
      #   --exit-code 1: fail on findings; the SARIF is written first, so
      #     the upload step (if: always()) still publishes them.
      - name: Run Trivy
        uses: docker://aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        with:
          args: >-
            fs
            --scanners vuln,secret,misconfig
            --severity CRITICAL,HIGH
            --ignore-unfixed
            --ignorefile .trivyignore.yaml
            --format sarif
            --output trivy-results.sarif
            --exit-code 1
            .

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
