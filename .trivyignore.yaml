# Accepted Trivy misconfigurations, each with justification and a path
# scope so the suppression can't silently hide the same issue elsewhere.
# Format: https://trivy.dev/docs/configuration/filtering/#trivyignoreyaml
#
# Reviewed in ADR-0019 (CI quality gates). Anything added here is a
# conscious risk acceptance, not a way to make a real finding go away.

misconfigurations:
  # The plugin install DaemonSet is a node installer: its `install`
  # container writes the kubelet credential-provider binary + config onto
  # the host (/etc/kubernetes, host bin dir) and restarts kubelet through
  # nsenter into PID 1. That genuinely requires the host PID namespace and
  # a privileged container. See
  # charts/harbor-bridge/templates/plugin-daemonset.yaml and ADR-0021. The
  # bridge Deployment and the long-running sync container are fully locked
  # down (non-privileged, no capabilities, read-only root FS, seccomp
  # RuntimeDefault); these apply only to the install init container,
  # observed here via the rendered golden chart fixtures Trivy scans.
  - id: KSV-0010 # pod hostPID: true — host PID namespace for the install handoff
    paths:
      - "charts/harbor-bridge/tests/golden/*.yaml"
  - id: KSV-0014 # install container rootfs writable — it writes host files
    paths:
      - "charts/harbor-bridge/tests/golden/*.yaml"
  - id: KSV-0017 # install container privileged — writes /etc/kubernetes on host
    paths:
      - "charts/harbor-bridge/tests/golden/*.yaml"
  # hostPath "/" on the install init container in auto/merge/patch modes:
  # merge mode writes into the credential-provider paths it DISCOVERS on
  # the running kubelet (EKS, GKE and AKS each use different ones), so the
  # paths are unknown at render time. The container is already privileged
  # with hostPID — i.e. root on the host — so the mount adds no privilege.
  # The long-running sync container mounts only plugin.hostConfigDir, and
  # install.mode=none (golden none.yaml) mounts two narrow directories.
  # Scoped to the two goldens that render an auto-mode DaemonSet.
  - id: KSV-0121 # disallowed volume (hostPath /) on the install container
    paths:
      - "charts/harbor-bridge/tests/golden/default.yaml"
      - "charts/harbor-bridge/tests/golden/mtls.yaml"
      - "charts/harbor-bridge/tests/golden/plugin-namespace.yaml"

  # The e2e seed image is throwaway test scaffolding built during
  # `make e2e` to prep Harbor; it is never shipped or run in production, so
  # a non-root USER buys nothing. (The shipped Dockerfile.plugin does set a
  # non-root USER.)
  - id: DS-0002 # no USER instruction
    paths:
      - "test/e2e/seed/Dockerfile"
