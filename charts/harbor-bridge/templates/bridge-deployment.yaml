apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harbor-bridge.bridge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor-bridge.bridge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bridge.replicas }}
  selector:
    matchLabels:
      {{- include "harbor-bridge.bridge.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "harbor-bridge.bridge.labels" . | nindent 8 }}
        {{- with .Values.bridge.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Re-roll when the TLS wiring changes (which Secret; chart- vs
        # operator-managed). Certificate ROTATION needs no restart: the
        # bridge reloads the serving pair and client CA from the mounted
        # Secret on its own.
        bridge.harbor.aetherize.io/tls-cert-checksum: {{ printf "%s|%v" (include "harbor-bridge.tlsSecretName" .) .Values.tls.enabled | sha256sum }}
        {{- with .Values.bridge.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "harbor-bridge.bridge.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Soft anti-affinity: prefer spreading replicas across nodes so
      # losing one node doesn't take both bridge pods down.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "harbor-bridge.bridge.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
        {{- with .Values.bridge.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.bridge.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bridge.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bridge
          image: {{ include "harbor-bridge.bridge.image" . }}
          imagePullPolicy: {{ .Values.bridge.image.pullPolicy }}
          args: []
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: BRIDGE_CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: BRIDGE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: BRIDGE_OIDC_ISSUER
              value: {{ .Values.bridge.oidcIssuer | quote }}
            # The only token audience the bridge serves (ADR-0026).
            - name: BRIDGE_AUDIENCE
              value: {{ .Values.plugin.audience | quote }}
            # Longest accepted token lifetime, and whether a token must be
            # bound to a pod (ADR-0028).
            - name: BRIDGE_TOKEN_MAX_LIFETIME
              value: {{ include "harbor-bridge.tokenMaxLifetime" . | quote }}
            - name: BRIDGE_REQUIRE_POD_BOUND_TOKEN
              value: {{ include "harbor-bridge.requirePodBinding" . | quote }}
            {{- with .Values.bridge.harborAccessSelector }}
            - name: BRIDGE_HARBORACCESS_SELECTOR
              value: {{ include "harbor-bridge.harborAccessSelector" $ | quote }}
            - name: BRIDGE_INSTANCE
              value: {{ include "harbor-bridge.instance" $ | quote }}
            {{- end }}
            - name: BRIDGE_RATE_LIMIT_PER_SOURCE
              value: {{ .Values.bridge.rateLimit.perSource | quote }}
            - name: BRIDGE_RATE_LIMIT_BURST
              value: {{ .Values.bridge.rateLimit.burst | quote }}
            {{- with .Values.bridge.oidcJWKSURL }}
            - name: BRIDGE_OIDC_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            - name: BRIDGE_OIDC_CA_FILE
              # In-cluster: the OIDC issuer is the apiserver and its
              # cert is signed by the cluster CA. The projected SA
              # volume always carries the cluster CA at this path.
              # Override via .Values.bridge.oidcCAFile to point at a
              # custom CA bundle (e.g. mTLS apiserver topologies).
              value: {{ .Values.bridge.oidcCAFile | quote }}
            - name: BRIDGE_OIDC_TOKEN_FILE
              # The apiserver gates /.well-known/openid-configuration
              # behind system:authenticated; the bridge sends its own
              # SA token as Bearer. Token rotates every ~hour; the
              # transport re-reads on every request.
              value: {{ .Values.bridge.oidcTokenFile | quote }}
            - name: BRIDGE_HARBOR_URL
              value: {{ .Values.harbor.url | quote }}
            - name: BRIDGE_HARBOR_ALLOW_INSECURE_HTTP
              value: {{ .Values.harbor.allowInsecureHTTP | quote }}
            {{- if .Values.harbor.caSecret.name }}
            - name: BRIDGE_HARBOR_CA_FILE
              value: /etc/bridge/harbor-ca/ca.crt
            {{- end }}
            - name: BRIDGE_HARBOR_ADMIN_DIR
              value: /etc/bridge/harbor-admin
            - name: BRIDGE_HARBOR_ROBOT_PREFIX
              value: {{ .Values.harbor.robotNamePrefix | quote }}
            {{- with .Values.harbor.registryHosts }}
            # Registry hosts whose images the data plane serves from
            # HarborAccess objects once Nexus is enabled (ADR-0033).
            - name: BRIDGE_HARBOR_REGISTRY_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if include "harbor-bridge.nexus.enabled" . }}
            {{- $nexus := .Values.nexus }}
            # Sonatype Nexus Repository backend (ADR-0033). The bridge
            # reads the admin credentials on every Nexus call.
            - name: BRIDGE_NEXUS_URL
              value: {{ $nexus.url | quote }}
            - name: BRIDGE_NEXUS_ALLOW_INSECURE_HTTP
              value: {{ dig "allowInsecureHTTP" false $nexus | quote }}
            {{- if dig "caSecret" "name" "" $nexus }}
            - name: BRIDGE_NEXUS_CA_FILE
              value: /etc/bridge/nexus-ca/ca.crt
            {{- end }}
            - name: BRIDGE_NEXUS_ADMIN_DIR
              value: /etc/bridge/nexus-admin
            - name: BRIDGE_NEXUS_REGISTRY_HOSTS
              value: {{ join "," $nexus.registryHosts | quote }}
            - name: BRIDGE_NEXUS_RATE_LIMIT_BACKOFF
              value: {{ dig "rateLimitBackoff" "15m" $nexus | toString | quote }}
            {{- end }}
            - name: BRIDGE_FORCE_LOCAL_VALIDATION
              value: {{ .Values.bridge.forceLocalValidation | quote }}
            - name: BRIDGE_LOG_LEVEL
              value: {{ .Values.bridge.logLevel | quote }}
            - name: BRIDGE_TLS_CERT_FILE
              value: /etc/bridge/tls/tls.crt
            - name: BRIDGE_TLS_KEY_FILE
              value: /etc/bridge/tls/tls.key
            {{- if .Values.bridge.mTLS.enabled }}
            - name: BRIDGE_TLS_CLIENT_CA_FILE
              value: /etc/bridge/tls/ca.crt
            {{- end }}
            - name: BRIDGE_LISTEN_ADDR
              value: ":8443"
            - name: BRIDGE_HEALTH_ADDR
              value: ":8081"
            - name: BRIDGE_METRICS_ADDR
              value: {{ ternary (printf ":%v" .Values.metrics.port) "0" .Values.metrics.enabled | quote }}
            - name: BRIDGE_ENABLE_LEADER_ELECTION
              value: {{ include "harbor-bridge.bridge.leaderElection" . | quote }}
            {{- with .Values.bridge.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.bridge.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: harbor-admin
              mountPath: /etc/bridge/harbor-admin
              readOnly: true
            - name: tls
              mountPath: /etc/bridge/tls
              readOnly: true
            {{- if .Values.harbor.caSecret.name }}
            - name: harbor-ca
              mountPath: /etc/bridge/harbor-ca
              readOnly: true
            {{- end }}
            {{- if include "harbor-bridge.nexus.enabled" . }}
            - name: nexus-admin
              mountPath: /etc/bridge/nexus-admin
              readOnly: true
            {{- if dig "caSecret" "name" "" .Values.nexus }}
            - name: nexus-ca
              mountPath: /etc/bridge/nexus-ca
              readOnly: true
            {{- end }}
            {{- end }}
          # Ready = the credential listener is bound (it binds only after
          # the informer caches synced) — so every replica the Service
          # routes to can actually serve.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.bridge.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: harbor-admin
          secret:
            secretName: {{ .Values.harbor.adminCredsSecret.name }}
            defaultMode: 0400
            items:
              - key: {{ .Values.harbor.adminCredsSecret.keys.username }}
                path: username
              - key: {{ .Values.harbor.adminCredsSecret.keys.password }}
                path: password
        {{- with .Values.harbor.caSecret }}
        {{- if .name }}
        - name: harbor-ca
          secret:
            secretName: {{ .name }}
            defaultMode: 0444
            items:
              - key: {{ .key }}
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- if include "harbor-bridge.nexus.enabled" . }}
        {{- $nexus := .Values.nexus }}
        - name: nexus-admin
          secret:
            secretName: {{ dig "adminCredsSecret" "name" "" $nexus | quote }}
            defaultMode: 0400
            items:
              - key: {{ dig "adminCredsSecret" "keys" "username" "username" $nexus | quote }}
                path: username
              - key: {{ dig "adminCredsSecret" "keys" "password" "password" $nexus | quote }}
                path: password
        {{- with dig "caSecret" "name" "" $nexus }}
        - name: nexus-ca
          secret:
            secretName: {{ . | quote }}
            defaultMode: 0444
            items:
              - key: {{ dig "caSecret" "key" "ca.crt" $nexus | quote }}
                path: ca.crt
        {{- end }}
        {{- end }}
        - name: tls
          secret:
            secretName: {{ include "harbor-bridge.tlsSecretName" . }}
            defaultMode: 0400
