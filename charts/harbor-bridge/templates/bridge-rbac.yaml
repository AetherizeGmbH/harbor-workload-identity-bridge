{{/*
HarborAccess CRs (and, with nexus.enabled, NexusAccess CRs) can live in
any namespace, so the bridge needs cluster-scoped list/watch on them.
Secrets and the leader-election Lease are namespace-scoped (release
namespace only) — the bridge never reads Secrets outside its own
namespace (ADR-0011). The nexususer Secrets of NexusAccess objects live
there too, under the same Secret rule.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "harbor-bridge.bridge.clusterScopedName" . }}
  labels:
    {{- include "harbor-bridge.bridge.labels" . | nindent 4 }}
rules:
  # Reconciler + data plane both list HarborAccess cluster-wide.
  - apiGroups: [harbor.aetherize.io]
    resources: [harboraccesses]
    # patch: finalizers; status goes through the status subresource.
    verbs: [get, list, watch, patch]
  - apiGroups: [harbor.aetherize.io]
    resources: [harboraccesses/status]
    verbs: [update, patch]
  - apiGroups: [harbor.aetherize.io]
    resources: [harboraccesses/finalizers]
    verbs: [update]
  {{- if include "harbor-bridge.nexus.enabled" . }}
  # NexusAccess objects (ADR-0036): the same access as HarborAccess. The
  # reconciler, the janitor and the data plane read them cluster-wide.
  - apiGroups: [nexus.aetherize.io]
    resources: [nexusaccesses]
    # patch: finalizers; status goes through the status subresource.
    verbs: [get, list, watch, patch]
  - apiGroups: [nexus.aetherize.io]
    resources: [nexusaccesses/status]
    verbs: [update, patch]
  - apiGroups: [nexus.aetherize.io]
    resources: [nexusaccesses/finalizers]
    verbs: [update]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "harbor-bridge.bridge.clusterScopedName" . }}
  labels:
    {{- include "harbor-bridge.bridge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "harbor-bridge.bridge.clusterScopedName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "harbor-bridge.bridge.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "harbor-bridge.bridge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor-bridge.bridge.labels" . | nindent 4 }}
rules:
  # Robot-credential Secrets (the admin credentials come from a volume
  # mount). No patch: the bridge creates, updates and deletes them.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, delete]
  # Leader-election Lease, only used when bridge.replicas > 1. client-go's
  # LeaseLock gets, creates and renews it; nothing else.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  # Leader election records its transitions as events.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "harbor-bridge.bridge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor-bridge.bridge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "harbor-bridge.bridge.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "harbor-bridge.bridge.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
