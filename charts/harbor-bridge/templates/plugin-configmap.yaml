{{/*
The kubelet credential-provider config the chart installs onto each
node. Mirrors the KEP-4412 v1 schema. Kubelet reads this from the
path `<plugin.hostConfigDir>/credential-provider-config.yaml` after
the DaemonSet copies it there (patch/none mode), or the installer
merges its one entry into the config kubelet already reads (merge
mode). With several installs per cluster each installer owns only the
entry named plugin.providerName (ADR-0029).

A non-default plugin.providerName publishes the config under another key
(harbor-bridge.plugin.configKey), which installers before ADR-0029 never
read.

`cacheType: ServiceAccount` (KEP-4412, beta and on by default from k8s
1.34) makes the pulling pod's ServiceAccount (namespace, name and UID),
not its token, part of kubelet's credential cache key, next to the
registry (cacheKeyType Registry, ADR-0016): kubelet requests a token for
the plugin only on a cache miss, and pods of the same ServiceAccount share
the cached credentials (SECURITY.md, "Replay of cached credentials"). They
are that ServiceAccount's robot's, valid for every pod that runs as it;
cacheType Token would key the cache by each pod's token instead.
The YAML comment on cacheType in the rendered config below is wrong about
this. It stays until the rendered config changes for another reason: every
byte of it reaches the node, and in patch mode a changed byte restarts
kubelet.
*/}}
{{- if .Values.plugin.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harbor-bridge.plugin.fullname" . }}
  namespace: {{ include "harbor-bridge.plugin.namespace" . }}
  labels:
    {{- include "harbor-bridge.plugin.labels" . | nindent 4 }}
data:
  {{ include "harbor-bridge.plugin.configKey" . }}: |
    apiVersion: kubelet.config.k8s.io/v1
    kind: CredentialProviderConfig
    providers:
      - name: {{ include "harbor-bridge.plugin.providerNameYAML" . }}
        apiVersion: credentialprovider.kubelet.k8s.io/v1
        matchImages:
          {{- range .Values.plugin.matchImages }}
          - {{ . | quote }}
          {{- end }}
        defaultCacheDuration: {{ .Values.plugin.defaultCacheDuration | quote }}
        env:
          - name: HARBOR_BRIDGE_ENDPOINT
            # Plugin runs on the node; default reaches the bridge via
            # the NodePort on the node's own loopback (ADR-0008),
            # overridable through plugin.bridgeEndpoint. A literal
            # $(NODE_IP) is substituted by the installer.
            value: {{ include "harbor-bridge.plugin.bridgeEndpoint" . | quote }}
          - name: HARBOR_BRIDGE_CA_BUNDLE
            value: {{ include "harbor-bridge.plugin.hostFile" (list . "ca.crt") | quote }}
          {{- with include "harbor-bridge.plugin.serverName" . }}
          {{- if contains "$(NODE_IP)" (include "harbor-bridge.plugin.bridgeEndpoint" $) }}
          # The node's IP is not in the bridge certificate; verify it
          # against the bridge Service's name, which is.
          {{- else }}
          # The endpoint's host is not in the bridge certificate; verify
          # it against the bridge Service's name, which is.
          {{- end }}
          - name: HARBOR_BRIDGE_SERVER_NAME
            value: {{ . | quote }}
          {{- end }}
          {{- if .Values.bridge.mTLS.enabled }}
          - name: HARBOR_BRIDGE_CLIENT_CERT
            value: {{ include "harbor-bridge.plugin.hostFile" (list . "client.crt") | quote }}
          - name: HARBOR_BRIDGE_CLIENT_KEY
            value: {{ include "harbor-bridge.plugin.hostFile" (list . "client.key") | quote }}
          {{- end }}
        tokenAttributes:
          serviceAccountTokenAudience: {{ .Values.plugin.audience | quote }}
          requireServiceAccount: true
          # See KEP-4412: this makes the SA token + UID part of the
          # cache key so each pod gets its own credential.
          cacheType: ServiceAccount
{{- end }}
