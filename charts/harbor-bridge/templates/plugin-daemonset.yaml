{{/*
DaemonSet that wires the plugin into every node's kubelet via the
harbor-bridge-installer (ADR-0021).

The init container runs one install pass for plugin.install.mode
(auto | merge | patch | none): it drops the plugin binary, provider
config, and CA onto the host and — except in none mode — restarts
kubelet IFF the restart-relevant content actually changed (content-
hash idempotency; a helm upgrade changing matchImages/audience
converges without operator action, a no-op re-roll never restarts
kubelet).

The long-running container is the same installer in --sync mode: it
re-copies the CA/mTLS files to the host when cert-manager rotates
them (kubelet updates the Secret volume in place; the plugin re-reads
the files on every exec, so no kubelet interaction is needed). It also
keeps the pod "running" so `kubectl logs` surfaces the install output
per node.

Everything except none mode needs hostPID (kubelet discovery via
/proc + nsenter for the restart), a privileged install container, and
the host root mounted at /host (merge-mode target paths are unknown at
render time). none mode drops all of that and keeps two narrow
hostPath mounts. The long-running sync container never gets more than
the one host directory it writes (hostConfigDir), in every mode.

Not rendered when plugin.enabled=false (plugin provisioned out of band,
e.g. a Talos system extension — issue #46).
*/}}
{{- if .Values.plugin.enabled }}
{{- /* Validate first: this template dereferences plugin.install.*, and
       helm may render it before any other template runs the checks. */}}
{{- include "harbor-bridge.validateRequiredValues" . }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "harbor-bridge.plugin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor-bridge.plugin.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "harbor-bridge.plugin.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        {{- include "harbor-bridge.plugin.labels" . | nindent 8 }}
        {{- with .Values.plugin.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Re-roll when the rendered provider config changes (the installer
        # then converges kubelet) or when the TLS wiring changes (which
        # Secret, mTLS on/off). CA/cert ROTATION does not re-roll: the sync
        # container copies rotated files in place (ADR-0021).
        plugin.harbor.aetherize.io/config-checksum: {{ include (print $.Template.BasePath "/plugin-configmap.yaml") . | sha256sum }}
        plugin.harbor.aetherize.io/tls-checksum: {{ printf "%s|%v|%v" (include "harbor-bridge.tlsSecretName" .) .Values.tls.enabled .Values.bridge.mTLS.enabled | sha256sum }}
        {{- with .Values.plugin.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "harbor-bridge.plugin.serviceAccountName" . }}
      # The installer never talks to the Kubernetes API.
      automountServiceAccountToken: false
      hostNetwork: false
      {{- if ne .Values.plugin.install.mode "none" }}
      # Required so the installer can read kubelet's command line from
      # /proc (auto/merge discovery) and `nsenter -t 1 ...` into the
      # host's namespaces for the kubelet restart. none mode does
      # neither and drops this.
      hostPID: true
      {{- end }}
      priorityClassName: system-node-critical
      securityContext:
        runAsNonRoot: false  # need root to write onto the host
        runAsUser: 0
      {{- with .Values.plugin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plugin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: install
          image: {{ include "harbor-bridge.plugin.image" . }}
          imagePullPolicy: {{ .Values.plugin.image.pullPolicy }}
          command: [/installer/harbor-bridge-installer]
          env:
            {{- include "harbor-bridge.plugin.installerEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "harbor-bridge.plugin.installerMounts" . | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            {{- if ne .Values.plugin.install.mode "none" }}
            # nsenter into PID 1 (kubelet restart) requires full
            # privileges; the sync container below does not get them.
            privileged: true
            {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
            {{- end }}
          resources:
            {{- toYaml .Values.plugin.resources | nindent 12 }}
      containers:
        - name: sync
          image: {{ include "harbor-bridge.plugin.image" . }}
          imagePullPolicy: {{ .Values.plugin.image.pullPolicy }}
          command: [/installer/harbor-bridge-installer, --sync]
          env:
            {{- include "harbor-bridge.plugin.installerEnv" . | nindent 12 }}
          volumeMounts:
            # Only the directory it writes: a compromised sync container
            # must not be a host-root compromise (audit H6).
            - name: host-config
              mountPath: /host{{ .Values.plugin.hostConfigDir }}
            {{- include "harbor-bridge.plugin.sourceMounts" . | nindent 12 }}
          securityContext:
            # Copies CA/mTLS files as root into a root-owned host dir —
            # no capabilities, no nsenter, no /proc, never privileged.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.plugin.resources | nindent 12 }}
      volumes:
        {{- if ne .Values.plugin.install.mode "none" }}
        - name: host-root
          hostPath:
            path: /
            type: Directory
        {{- else }}
        - name: host-bin
          hostPath:
            path: {{ .Values.plugin.hostBinaryDir }}
            type: DirectoryOrCreate
        {{- end }}
        - name: host-config
          hostPath:
            path: {{ .Values.plugin.hostConfigDir }}
            type: DirectoryOrCreate
        - name: kubelet-config
          configMap:
            name: {{ include "harbor-bridge.plugin.fullname" . }}
            defaultMode: 0644
        - name: tls
          secret:
            secretName: {{ include "harbor-bridge.tlsSecretName" . }}
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
        {{- if .Values.bridge.mTLS.enabled }}
        - name: mtls
          secret:
            secretName: {{ include "harbor-bridge.mTLSClientSecretName" . }}
            defaultMode: 0400
        {{- end }}
{{- end }}

{{/*
Env + mounts shared by the install and sync containers. The installer
addresses every node path as HOST_ROOT+<node path>; in none mode the
two narrow mounts are placed at exactly those container paths, so the
same addressing works without a host-root mount.
*/}}
{{- define "harbor-bridge.plugin.installerEnv" -}}
- name: INSTALL_MODE
  value: {{ .Values.plugin.install.mode | quote }}
- name: HOST_ROOT
  value: /host
- name: HOST_BIN_DIR
  value: {{ .Values.plugin.hostBinaryDir | quote }}
- name: HOST_CONFIG_DIR
  value: {{ .Values.plugin.hostConfigDir | quote }}
{{- if .Values.plugin.install.binDir }}
- name: INSTALL_MERGE_BIN_DIR
  value: {{ .Values.plugin.install.binDir | quote }}
- name: INSTALL_MERGE_CONFIG_FILE
  value: {{ .Values.plugin.install.configFile | quote }}
{{- end }}
- name: MTLS_ENABLED
  value: {{ .Values.bridge.mTLS.enabled | quote }}
- name: KUBELET_UNIT
  value: {{ .Values.plugin.install.kubeletUnit | quote }}
- name: STATE_DIR
  value: {{ .Values.plugin.install.stateDir | quote }}
- name: NODE_IP
  valueFrom:
    fieldRef:
      fieldPath: status.hostIP
{{- end -}}

{{- define "harbor-bridge.plugin.installerMounts" -}}
{{- if ne .Values.plugin.install.mode "none" -}}
- name: host-root
  mountPath: /host
{{- else -}}
- name: host-bin
  mountPath: /host{{ .Values.plugin.hostBinaryDir }}
- name: host-config
  mountPath: /host{{ .Values.plugin.hostConfigDir }}
{{- end }}
{{ include "harbor-bridge.plugin.sourceMounts" . }}
{{- end -}}

{{/* Read-only inputs both containers copy from. */}}
{{- define "harbor-bridge.plugin.sourceMounts" -}}
- name: kubelet-config
  mountPath: /config
  readOnly: true
- name: tls
  mountPath: /tls
  readOnly: true
{{- if .Values.bridge.mTLS.enabled }}
- name: mtls
  mountPath: /mtls
  readOnly: true
{{- end }}
{{- end -}}
