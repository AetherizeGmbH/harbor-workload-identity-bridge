{{- if .Values.plugin.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "harbor-bridge.plugin.serviceAccountName" . }}
  namespace: {{ include "harbor-bridge.plugin.namespace" . }}
  labels:
    {{- include "harbor-bridge.plugin.labels" . | nindent 4 }}
# Plugin pods do not talk to the K8s API — the binary running on the
# node makes a single HTTPS call to the bridge and exits. The DaemonSet
# gets a ServiceAccount of its own, without a token, so it does not run
# as the namespace's default ServiceAccount; its Secret and ConfigMap
# volumes do not depend on it.
automountServiceAccountToken: false
{{- end }}
