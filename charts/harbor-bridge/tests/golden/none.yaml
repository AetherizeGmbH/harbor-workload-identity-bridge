apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-bridge
  namespace: harbor-bridge-system
  labels:
    helm.sh/chart: harbor-workload-identity-bridge-0.7.0
    app.kubernetes.io/version: "0.7.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: harbor-workload-identity-bridge
    app.kubernetes.io/name: harbor-workload-identity-bridge
    app.kubernetes.io/instance: harbor-bridge
    app.kubernetes.io/component: bridge
rules:
  # Robot-credential Secrets (the admin credentials come from a volume
  # mount). No patch: the bridge creates, updates and deletes them.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, delete]
  # Leader-election Lease, only used when bridge.replicas > 1. client-go's
  # LeaseLock gets, creates and renews it; nothing else.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  # Leader election records its transitions as events.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]

