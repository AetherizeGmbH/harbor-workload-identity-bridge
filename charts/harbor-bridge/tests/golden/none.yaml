  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        helm.sh/chart: harbor-workload-identity-bridge-0.7.0
        app.kubernetes.io/version: "0.7.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: harbor-workload-identity-bridge
        app.kubernetes.io/name: harbor-workload-identity-bridge
        app.kubernetes.io/instance: harbor-bridge
        app.kubernetes.io/component: plugin
      annotations:
        # Re-roll when the rendered provider config changes (the installer
        # then converges kubelet) or when the TLS wiring changes (which
        # Secret, mTLS on/off). CA/cert ROTATION does not re-roll: the sync
        # container copies rotated files in place (ADR-0021).
        plugin.harbor.aetherize.io/config-checksum: c3487c4e509f4437b192bcbadeca8843792a61bca79c1c71d0f7a08ff489bd4e
        plugin.harbor.aetherize.io/tls-checksum: 01e71f64171b7038938e0ce33dba2052236a26623cfb529b390919c70fe71bf4
    spec:
      serviceAccountName: harbor-bridge-plugin
      # The installer never talks to the Kubernetes API.
      automountServiceAccountToken: false
      hostNetwork: false
      priorityClassName: system-node-critical
      securityContext:
        runAsNonRoot: false  # need root to write onto the host
        runAsUser: 0
      tolerations:
        - operator: Exists
      initContainers:
        - name: install
          image: ghcr.io/aetherizegmbh/harbor-workload-identity-bridge-plugin:0.7.0
          imagePullPolicy: IfNotPresent
          command: [/installer/harbor-bridge-installer]
          env:
            - name: INSTALL_MODE
              value: "none"
            - name: HOST_ROOT
              value: /host
            - name: HOST_BIN_DIR
              value: "/etc/kubernetes/credential-provider"
            - name: HOST_CONFIG_DIR
              value: "/etc/kubernetes/credential-provider-config"
            - name: MTLS_ENABLED
              value: "false"
            - name: KUBELET_UNIT
              value: "kubelet"
            - name: STATE_DIR
              value: "/var/lib/harbor-bridge"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: host-bin
              mountPath: /host/etc/kubernetes/credential-provider
            - name: host-config
              mountPath: /host/etc/kubernetes/credential-provider-config
            - name: kubelet-config
              mountPath: /config
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: sync
          image: ghcr.io/aetherizegmbh/harbor-workload-identity-bridge-plugin:0.7.0
          imagePullPolicy: IfNotPresent
          command: [/installer/harbor-bridge-installer, --sync]
          env:
            - name: INSTALL_MODE
              value: "none"
            - name: HOST_ROOT
              value: /host
            - name: HOST_BIN_DIR
              value: "/etc/kubernetes/credential-provider"
            - name: HOST_CONFIG_DIR
              value: "/etc/kubernetes/credential-provider-config"
            - name: MTLS_ENABLED
              value: "false"
            - name: KUBELET_UNIT
              value: "kubelet"
            - name: STATE_DIR
              value: "/var/lib/harbor-bridge"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            # Only the directory it writes: a compromised sync container
            # must not be a host-root compromise (audit H6).
            - name: host-config
              mountPath: /host/etc/kubernetes/credential-provider-config
            - name: kubelet-config
              mountPath: /config
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
          securityContext:
            # Copies CA/mTLS files as root into a root-owned host dir —
            # no capabilities, no nsenter, no /proc, never privileged.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: host-bin
          hostPath:
            path: /etc/kubernetes/credential-provider
            type: DirectoryOrCreate
        - name: host-config
          hostPath:
            path: /etc/kubernetes/credential-provider-config
            type: DirectoryOrCreate
        - name: kubelet-config
          configMap:
            name: harbor-bridge-plugin
            defaultMode: 0644
        - name: tls
          secret:
            secretName: harbor-bridge-tls
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt


