# Source: harbor-workload-identity-bridge/templates/bridge-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-bridge-eu
  namespace: harbor-bridge-eu
  labels:
    helm.sh/chart: harbor-workload-identity-bridge-0.11.5
    app.kubernetes.io/version: "0.11.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: harbor-workload-identity-bridge
    app.kubernetes.io/name: harbor-workload-identity-bridge
    app.kubernetes.io/instance: harbor-bridge-eu
    app.kubernetes.io/component: bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-workload-identity-bridge
      app.kubernetes.io/instance: harbor-bridge-eu
      app.kubernetes.io/component: bridge
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        helm.sh/chart: harbor-workload-identity-bridge-0.11.5
        app.kubernetes.io/version: "0.11.5"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: harbor-workload-identity-bridge
        app.kubernetes.io/name: harbor-workload-identity-bridge
        app.kubernetes.io/instance: harbor-bridge-eu
        app.kubernetes.io/component: bridge
      annotations:
        # Re-roll when the TLS wiring changes (which Secret; chart- vs
        # operator-managed). Certificate ROTATION needs no restart: the
        # bridge reloads the serving pair and client CA from the mounted
        # Secret on its own.
        bridge.harbor.aetherize.io/tls-cert-checksum: 5dbab86d40549cad6d345bf23b2f3c525a2c69f3b603d4bcc2cecc6b53f931d5
    spec:
      serviceAccountName: harbor-bridge-eu
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Soft anti-affinity: prefer spreading replicas across nodes so
      # losing one node doesn't take both bridge pods down.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: harbor-workload-identity-bridge
                    app.kubernetes.io/instance: harbor-bridge-eu
                    app.kubernetes.io/component: bridge
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: bridge
          image: ghcr.io/aetherizegmbh/harbor-workload-identity-bridge:0.11.5
          imagePullPolicy: IfNotPresent
          args: []
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: BRIDGE_CLUSTER_NAME
              value: "prod-eu-west-2"
            - name: BRIDGE_NAMESPACE
              value: "harbor-bridge-eu"
            - name: BRIDGE_OIDC_ISSUER
              value: "https://kubernetes.default.svc.cluster.local"
            # The only token audience the bridge serves (ADR-0026).
            - name: BRIDGE_AUDIENCE
              value: "harbor-bridge-prod-eu-west-2"
            # Longest accepted token lifetime, and whether a token must be
            # bound to a pod (ADR-0028).
            - name: BRIDGE_TOKEN_MAX_LIFETIME
              value: "1h"
            - name: BRIDGE_REQUIRE_POD_BOUND_TOKEN
              value: "true"
            - name: BRIDGE_HARBORACCESS_SELECTOR
              value: "harbor.aetherize.io/bridge=harbor-eu"
            - name: BRIDGE_INSTANCE
              value: "harbor-bridge-eu"
            - name: BRIDGE_RATE_LIMIT_PER_SOURCE
              value: "20"
            - name: BRIDGE_RATE_LIMIT_BURST
              value: "100"
            - name: BRIDGE_OIDC_CA_FILE
              # In-cluster: the OIDC issuer is the apiserver and its
              # cert is signed by the cluster CA. The projected SA
              # volume always carries the cluster CA at this path.
              # Override via .Values.bridge.oidcCAFile to point at a
              # custom CA bundle (e.g. mTLS apiserver topologies).
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            - name: BRIDGE_OIDC_TOKEN_FILE
              # The apiserver gates /.well-known/openid-configuration
              # behind system:authenticated; the bridge sends its own
              # SA token as Bearer. Token rotates every ~hour; the
              # transport re-reads on every request.
              value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
            - name: BRIDGE_HARBOR_URL
              value: "https://harbor.example.com"
            - name: BRIDGE_HARBOR_ALLOW_INSECURE_HTTP
              value: "false"
            - name: BRIDGE_HARBOR_ADMIN_DIR
              value: /etc/bridge/harbor-admin
            - name: BRIDGE_HARBOR_ROBOT_PREFIX
              value: "robot$"
            - name: BRIDGE_FORCE_LOCAL_VALIDATION
              value: "true"
            - name: BRIDGE_LOG_LEVEL
              value: "info"
            - name: BRIDGE_TLS_CERT_FILE
              value: /etc/bridge/tls/tls.crt
            - name: BRIDGE_TLS_KEY_FILE
              value: /etc/bridge/tls/tls.key
            - name: BRIDGE_TLS_CLIENT_CA_FILE
              value: /etc/bridge/tls/ca.crt
            - name: BRIDGE_LISTEN_ADDR
              value: ":8443"
            - name: BRIDGE_HEALTH_ADDR
              value: ":8081"
            - name: BRIDGE_METRICS_ADDR
              value: ":8080"
            - name: BRIDGE_ENABLE_LEADER_ELECTION
              value: "true"
          volumeMounts:
            - name: harbor-admin
              mountPath: /etc/bridge/harbor-admin
              readOnly: true
            - name: tls
              mountPath: /etc/bridge/tls
              readOnly: true
          # Ready = the credential listener is bound (it binds only after
          # the informer caches synced) — so every replica the Service
          # routes to can actually serve.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: harbor-admin
          secret:
            secretName: harbor-admin
            defaultMode: 0400
            items:
              - key: username
                path: username
              - key: password
                path: password
        - name: tls
          secret:
            secretName: harbor-bridge-eu-tls
