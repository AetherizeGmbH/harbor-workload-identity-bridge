apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: harbor-bridge-eu-plugin
  namespace: harbor-bridge-eu
  labels:
    helm.sh/chart: harbor-workload-identity-bridge-0.11.5
    app.kubernetes.io/version: "0.11.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: harbor-workload-identity-bridge
    app.kubernetes.io/name: harbor-workload-identity-bridge
    app.kubernetes.io/instance: harbor-bridge-eu
    app.kubernetes.io/component: plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-workload-identity-bridge
      app.kubernetes.io/instance: harbor-bridge-eu
      app.kubernetes.io/component: plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        helm.sh/chart: harbor-workload-identity-bridge-0.11.5
        app.kubernetes.io/version: "0.11.5"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: harbor-workload-identity-bridge
        app.kubernetes.io/name: harbor-workload-identity-bridge
        app.kubernetes.io/instance: harbor-bridge-eu
        app.kubernetes.io/component: plugin
      annotations:
        # Re-roll when the rendered provider config changes (the installer
        # then converges kubelet) or when the TLS wiring changes (which
        # Secret, mTLS on/off). CA/cert ROTATION does not re-roll: the sync
        # container copies rotated files in place (ADR-0021).
        plugin.harbor.aetherize.io/config-checksum: 3c726d68615b98bfd6113546fa9b51873fbfffe5adc66b7fda5036cf5e40b78d
        plugin.harbor.aetherize.io/tls-checksum: 57e56ec1ae9a392310d6e30eeb777a8116efd367dca74943f17b1d83282a1cd2
    spec:
      serviceAccountName: harbor-bridge-eu-plugin
      # The installer never talks to the Kubernetes API.
      automountServiceAccountToken: false
      hostNetwork: false
      # Required so the installer can read kubelet's command line from
      # /proc (auto/merge discovery) and `nsenter -t 1 ...` into the
      # host's namespaces for the kubelet restart. none mode does
      # neither and drops this.
      hostPID: true
      priorityClassName: system-node-critical
      securityContext:
        runAsNonRoot: false  # need root to write onto the host
        runAsUser: 0
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      initContainers:
        - name: install
          image: ghcr.io/aetherizegmbh/harbor-workload-identity-bridge-plugin:0.11.5
          imagePullPolicy: IfNotPresent
          command: [/installer/harbor-bridge-installer]
          env:
            - name: INSTALL_MODE
              value: "auto"
            - name: HOST_ROOT
              value: /host
            - name: HOST_BIN_DIR
              value: "/etc/kubernetes/credential-provider"
            - name: HOST_CONFIG_DIR
              value: "/etc/kubernetes/credential-provider-config"
            - name: MTLS_ENABLED
              value: "true"
            - name: KUBELET_UNIT
              value: "kubelet"
            - name: STATE_DIR
              value: "/var/lib/harbor-bridge"
            - name: PROVIDER_NAME
              value: "harbor-bridge-eu"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: kubelet-config
              mountPath: /config-v2
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: mtls
              mountPath: /mtls
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            # nsenter into PID 1 (kubelet restart) requires full
            # privileges; the sync container below does not get them.
            privileged: true
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: sync
          image: ghcr.io/aetherizegmbh/harbor-workload-identity-bridge-plugin:0.11.5
          imagePullPolicy: IfNotPresent
          command: [/installer/harbor-bridge-installer, --sync]
          env:
            - name: INSTALL_MODE
              value: "auto"
            - name: HOST_ROOT
              value: /host
            - name: HOST_BIN_DIR
              value: "/etc/kubernetes/credential-provider"
            - name: HOST_CONFIG_DIR
              value: "/etc/kubernetes/credential-provider-config"
            - name: MTLS_ENABLED
              value: "true"
            - name: KUBELET_UNIT
              value: "kubelet"
            - name: STATE_DIR
              value: "/var/lib/harbor-bridge"
            - name: PROVIDER_NAME
              value: "harbor-bridge-eu"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            # Only the directory it writes: a compromised sync container
            # must not be a host-root compromise (audit H6).
            - name: host-config
              mountPath: /host/etc/kubernetes/credential-provider-config
            - name: kubelet-config
              mountPath: /config-v2
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: mtls
              mountPath: /mtls
              readOnly: true
          securityContext:
            # Copies CA/mTLS files as root into a root-owned host dir —
            # no capabilities, no nsenter, never privileged. Outside none
            # mode it shares the pod's host PID namespace (SECURITY.md).
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: host-config
          hostPath:
            path: /etc/kubernetes/credential-provider-config
            type: DirectoryOrCreate
        - name: kubelet-config
          configMap:
            name: harbor-bridge-eu-plugin
            defaultMode: 0644
        - name: tls
          secret:
            secretName: harbor-bridge-eu-tls
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
        - name: mtls
          secret:
            secretName: harbor-bridge-eu-plugin-mtls-client
            defaultMode: 0400


