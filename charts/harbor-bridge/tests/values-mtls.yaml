# Variant that exercises every conditional template branch:
#   - the CA the chart creates for the release (no tls.issuerRef.name,
#     ADR-0042), which signs the serving and the client certificate
#   - mTLS between plugin and bridge
#   - Prometheus Operator ServiceMonitor
clusterName: prod-eu-west

harbor:
  url: https://harbor.example.com
  adminCredsSecret:
    name: harbor-admin

plugin:
  matchImages:
    - "harbor.example.com"
  audience: harbor-bridge-prod-eu-west

tls:
  enabled: true

bridge:
  mTLS:
    enabled: true

metrics:
  serviceMonitor:
    enabled: true
