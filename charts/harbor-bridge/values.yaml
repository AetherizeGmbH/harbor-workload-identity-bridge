# ====================================================================
# REQUIRED VALUES
# These have no default. Install fails if they are unset or empty.
# ====================================================================

# Logical name for this cluster, used as the Harbor robot-name prefix
# (ADR-0009 / ADR-0018). Must be a DNS label and distinct from every
# other cluster sharing the same Harbor. The ownership prefix is
# dot-terminated (`bridge-<clusterName>.`), so distinct names are
# automatically collision-free — there is no longer any requirement to
# avoid being a hyphen-prefix of another cluster's name (the old
# hyphen-delimited scheme had that footgun; ADR-0018 removed it).
clusterName: ""

harbor:
  # Base URL of the Harbor instance the bridge manages robots in. Use
  # https: over plain http the admin credentials travel on every call and
  # robot passwords come back in the responses.
  url: ""

  # Allow an http:// url anyway (e.g. an in-cluster Harbor reached over
  # the pod network in a test cluster).
  allowInsecureHTTP: false

  # Existing Secret in the release namespace with the CA that signs
  # Harbor's certificate, for a Harbor behind a private CA. Empty = the
  # system trust store.
  caSecret:
    name: ""
    key: ca.crt

  # Reference to an *existing* Secret in the release namespace holding
  # Harbor admin credentials. Two keys: `username`, `password`.
  # The chart does NOT create this Secret — the operator does, so the
  # password never lives in values.yaml or a git-committed manifest.
  adminCredsSecret:
    name: ""
    # Override key names if the operator's existing Secret uses
    # different conventions (e.g. `harbor-username`).
    keys:
      username: username
      password: password

  # Robot name prefix of this Harbor (Harbor's robot_name_prefix setting).
  # Harbor stores robot names without it and reports them with it; the
  # bridge must know it to recognise its own robots. Change it only if the
  # Harbor administrator changed the setting (a common change, because
  # "$" in a username trips up shells and some registry clients).
  robotNamePrefix: "robot$"

tls:
  # The bridge ALWAYS serves TLS and the plugin ALWAYS verifies it; this
  # switch only chooses who provides the serving certificate.
  #   true  — the chart requests it from cert-manager (issuerRef below).
  #   false — you provide it: set existingSecret to a Secret in the
  #           release namespace with tls.crt, tls.key and ca.crt (the CA
  #           the plugin trusts, and the client CA when mTLS is on).
  enabled: true

  # Required when enabled=false. Ignored otherwise.
  existingSecret: ""

  # cert-manager issuer that signs the bridge's serving cert. The CA
  # from the same chain is plumbed to the plugin DaemonSet so kubelet
  # nodes trust the bridge's cert.
  issuerRef:
    name: ""
    kind: ClusterIssuer  # ClusterIssuer | Issuer

# ====================================================================
# DEFAULTED VALUES — override as needed
# ====================================================================

# Override the chart name used in labels / the release-derived object
# names (standard Helm convention).
nameOverride: ""
fullnameOverride: ""

bridge:
  replicas: 2

  # Leader election is auto-enabled when replicas > 1; explicit override.
  leaderElection: null  # null = auto from replicas; true | false to force.

  image:
    repository: ghcr.io/aetherizegmbh/harbor-workload-identity-bridge
    # Defaults to .Chart.AppVersion when empty.
    tag: ""
    # Pin the image by digest (sha256:...); when set, tag is ignored.
    # Verify the digest's signature first (SECURITY.md).
    digest: ""
    pullPolicy: IfNotPresent

  # Service-account-token issuer the bridge validates incoming SA
  # tokens against. Match the cluster's actual issuer (find it with
  # `kubectl get --raw /.well-known/openid-configuration | jq -r .issuer`).
  # Managed clouds use their own issuer URL (GKE:
  # https://container.googleapis.com/v1/projects/…/clusters/…, EKS:
  # https://oidc.eks.<region>.amazonaws.com/id/…) — set it, and set
  # oidcJWKSURL below.
  oidcIssuer: https://kubernetes.default.svc.cluster.local

  # Where the bridge fetches the token-signing keys. Empty = OIDC
  # discovery at oidcIssuer (right when the issuer IS the in-cluster
  # apiserver). When the issuer is a cloud URL, set this to the
  # apiserver's own JWKS endpoint, https://kubernetes.default.svc/openid/v1/jwks:
  # the keys come from inside the cluster (no internet egress needed, the
  # cluster CA + the bridge's token below authenticate it), and the
  # issuer claim is still checked against oidcIssuer.
  oidcJWKSURL: ""

  # CA bundle used to verify the OIDC issuer's TLS cert. For the
  # default in-cluster issuer (the apiserver), the projected SA volume
  # is the canonical path. Override only for unusual apiserver TLS
  # topologies (e.g. when discovery goes through an external IdP).
  oidcCAFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

  # The bridge's own ServiceAccount token, sent on discovery / JWKS
  # requests because the apiserver serves them only to authenticated
  # callers. It goes only to the in-cluster apiserver (the kubernetes
  # Service names or KUBERNETES_SERVICE_HOST) over https, and to the
  # jwks_uri the apiserver's own discovery names; never to a cloud
  # issuer, another host, or a redirect target. Re-read per request, so
  # kubelet's hourly token rotation is transparent. Empty disables it.
  oidcTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token

  # Reserved for after upstream Harbor implements native OIDC trust
  # policies (goharbor/harbor#17520). Keep true today.
  forceLocalValidation: true

  logLevel: info  # debug | info | warn | error

  # Several bridges on one cluster (e.g. one per Harbor instance): each
  # serves only the HarborAccess objects whose labels match this map
  # (ADR-0026). Empty = every HarborAccess. Bridges that share a Harbor
  # must use different clusterName values. The bridge only ever serves
  # plugin.audience, whatever a CR names.
  # harborAccessSelector:
  #   harbor.aetherize.io/bridge: harbor-eu
  harborAccessSelector: {}

  # Names this bridge among several (its HarborAccess finalizer is
  # harbor.aetherize.io/robot-<instance>). Used only with a selector.
  # Empty = the release name. DNS label, at most 50 characters.
  instance: ""
  # Requests per second (and burst) the credential endpoint accepts from
  # one source IP before it answers 429. Kubelet calls through its node's
  # address and caches credentials per registry, so it stays far below.
  # perSource: 0 disables the limit.
  rateLimit:
    perSource: 20
    burst: 100

  # mTLS between plugin and bridge — optional defense-in-depth on top
  # of SA-token validation (ADR-0008). When enabled, the plugin
  # presents a chart-issued client cert; the bridge rejects connections
  # without one.
  mTLS:
    enabled: false
    # cert-manager Issuer used to sign client certs for plugin pods.
    clientIssuerRef:
      name: ""
      kind: ClusterIssuer

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Keeps at least one bridge replica serving through voluntary
  # disruptions (node drains, cluster upgrades). Rendered only when
  # replicas > 1.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Override only if you need to plumb additional env vars (e.g.
  # HTTP_PROXY). Both static envs and envFrom are supported.
  extraEnv: []
  extraEnvFrom: []

plugin:
  # Deploy the node installer DaemonSet (and its ConfigMap and
  # ServiceAccount). Set false when the plugin is provisioned on the nodes
  # by other means — a Talos system extension, a baked node image, your
  # own configuration management. The bridge, the audience RBAC for
  # kubelet, and the NOTES (which print the provider entry to install)
  # stay; matchImages and install.* are then unused. See
  # docs/install-external-plugin.md.
  enabled: true

  # ─── REQUIRED (when plugin.enabled) ─────────────────────────────────
  # Image patterns (kubelet glob format) for which kubelet should call
  # this plugin. REQUIRED — an empty list means kubelet never invokes
  # the plugin and image pulls silently fall back to anonymous.
  # Kubelet's matchImages supports globs in the DOMAIN only — not in
  # the port or path. So `harbor.example.com/*` is a literal `/*`
  # path prefix and won't match `harbor.example.com/library/img:tag`.
  # Use the bare host (or host:port) form to match any image from a
  # registry. Subdomain globs work: `*.harbor.example.com`.
  # Example: ["harbor.example.com", "*.harbor.example.com"]
  matchImages: []

  # Audience the kubelet projects the SA token with. Must match
  # spec.trustPolicy.audience on every HarborAccess CR served by this
  # bridge. Pick one string per cluster; embedding the cluster name is
  # a defensible default ("harbor-bridge-<cluster>"). REQUIRED even when
  # plugin.enabled=false: kubelet needs RBAC to mint tokens for it.
  audience: ""

  # ─── DEFAULTED ──────────────────────────────────────────────────────
  # Audience-scoped ClusterRole + ClusterRoleBinding that grants every
  # kubelet (system:nodes) permission to mint TokenRequests for the
  # audience above. REQUIRED on clusters with the
  # ServiceAccountNodeAudienceRestriction feature gate enabled
  # (default since Kubernetes v1.32) — without it kubelet's TokenRequest
  # fails and the credential provider silently produces no credentials.
  # See ADR-0017. Disable only if you provide your own RBAC.
  audienceRBAC:
    create: true


  # Image carrying the plugin binary. The DaemonSet copies the binary
  # out of this image onto each node's filesystem; the kubelet exec's
  # the on-node binary, not anything in the pod.
  image:
    repository: ghcr.io/aetherizegmbh/harbor-workload-identity-bridge-plugin
    tag: ""
    # Pin by digest (sha256:...); kubelet runs this binary as root on
    # every node. When set, tag is ignored.
    digest: ""
    pullPolicy: IfNotPresent

  # Where on each node the plugin binary and config are written in
  # patch/none modes. In every mode hostConfigDir also carries the
  # bridge CA (and mTLS client pair) — the provider entry references
  # them by absolute path. In merge mode the binary and provider entry
  # instead go into the paths discovered from kubelet's own flags, so
  # hostBinaryDir is unused there.
  hostBinaryDir: /etc/kubernetes/credential-provider
  hostConfigDir: /etc/kubernetes/credential-provider-config

  # How the DaemonSet's installer wires the plugin into kubelet
  # (ADR-0021). Replaces the removed plugin.patchKubelet toggle.
  install:
    # auto  — inspect the live kubelet command line: if the node
    #         already runs kubelet with --image-credential-provider-*
    #         flags (EKS / GKE / AKS node images), behave as `merge`;
    #         otherwise behave as `patch`. The right default almost
    #         everywhere.
    # merge — inject our provider entry into the node's EXISTING
    #         CredentialProviderConfig (JSON or YAML; foreign providers
    #         and unknown fields are preserved) and drop the binary
    #         into the existing bin dir. Kubelet flags are not touched.
    # patch — own dirs (hostBinaryDir/hostConfigDir) plus a parse-merge
    #         of /etc/default/kubelet's KUBELET_EXTRA_ARGS (operator-set
    #         args are preserved). For kind and kubeadm nodes whose kubelet
    #         unit sources /etc/default/kubelet.
    #
    # auto/merge/patch need a systemd-managed kubelet. Distributions that
    # embed or supervise kubelet themselves (k3s, RKE2, Talos) are not
    # supported by them: use none (and wire the flags through the
    # distribution's own kubelet configuration) or plugin.enabled=false.
    # none  — copy files only; the operator owns the kubelet flags.
    #         Least privilege: no hostPID, no privileged container, no
    #         host-root mount.
    #
    # In every mode except none, kubelet is restarted ONLY when the
    # effective credential-provider config content (or the kubelet
    # flags) actually changed, and the install counts as done only after
    # kubelet is verified stably active (and, in patch mode, running with
    # the flags) — a `helm upgrade` that changes
    # matchImages/audience converges without operator action, and no-op
    # re-rolls never restart kubelet. Kubelet restarts do not disturb
    # running containers. CA/mTLS rotation and plugin binary updates
    # never restart kubelet.
    mode: auto
    # Merge-mode target overrides. Leave empty to use the paths
    # discovered from kubelet's --image-credential-provider-* flags.
    binDir: ""
    configFile: ""
    # Systemd unit the installer restarts.
    kubeletUnit: kubelet
    # Node directory holding the installer's idempotency state file.
    stateDir: /var/lib/harbor-bridge

  # URL the on-node plugin uses to reach the bridge. Empty renders the
  # ADR-0008 default: https://127.0.0.1:<service.nodePort> (node-local
  # loopback NodePort). The literal $(NODE_IP) is substituted with the
  # node's IP by the installer — use e.g. "https://$(NODE_IP):31443" on
  # dataplanes that do not route loopback NodePorts.
  bridgeEndpoint: ""

  # The plugin can only run after its own image was pulled, so the
  # plugin/bridge images must come from a registry that does NOT match
  # plugin.matchImages. The chart fails at template time when the image
  # registry host exactly equals a matchImages entry. Set true only for
  # air-gapped mirrors that accept the bootstrap ordering (first pull
  # of the bridge images must not need the bridge).
  allowSelfMatchImages: false

  # How long kubelet may cache credentials returned by the plugin.
  # Bounded above by the HarborAccess CR's spec.tokenTTL; this is just
  # kubelet's view, not a contract with Harbor.
  defaultCacheDuration: 1h

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations:
    # Plugin must land on control-plane nodes too — kubelet on every
    # node needs to exec it for image pulls. This also places a
    # privileged pod on control-plane nodes; narrow it (e.g. to your
    # worker taints) if no workload there pulls from Harbor.
    - operator: Exists

# Service shape. ADR-0008: NodePort by default so plugin pods can reach
# the bridge via node-local routing (plugin → 127.0.0.1:<nodePort>).
service:
  type: NodePort
  port: 8443
  nodePort: 31443

# Prometheus metrics. The bridge serves /metrics over plain HTTP on its
# own port, reachable on the pod network only (a ClusterIP Service) —
# never on the credential listener the NodePort exposes on every node.
metrics:
  enabled: true
  port: 8080
  # When the Prometheus Operator is present, set this to true to ship
  # a ServiceMonitor that scrapes the bridge's metrics port (plain HTTP on
  # the pod network, <release>-metrics Service; never the NodePort).
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
