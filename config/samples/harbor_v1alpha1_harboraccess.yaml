# Sample HarborAccess granting the flux-system source-controller ServiceAccount
# pull access to the "production" and "shared-base-images" Harbor projects.
#
# The audience must equal the bridge's audience (plugin.audience, default
# harbor-bridge-<clusterName>); the chart's NOTES print it.
apiVersion: harbor.aetherize.io/v1alpha1
kind: HarborAccess
metadata:
  name: source-controller-access
  namespace: harbor-bridge-system
spec:
  serviceAccountRef:
    namespace: flux-system
    name: source-controller
  trustPolicy:
    # Must equal the bridge's audience (ADR-0026): plugin.audience, by
    # default harbor-bridge-<clusterName>.
    audience: harbor-bridge-prod
    # Optional (ADR-0043): without it the object trusts the bridge's issuer
    # (bridge.oidcIssuer, or the one the bridge reads from the apiserver
    # when that is empty, ADR-0044). Set it, byte for byte, to have the
    # object refused on a cluster with another issuer; find your cluster's with
    # kubectl get --raw /.well-known/openid-configuration | jq -r .issuer
    # issuer: https://kubernetes.default.svc.cluster.local
  permissions:
    - project: production
      action: pull
    - project: shared-base-images
      action: pull
  tokenTTL: 1h
